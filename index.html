<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>日常管理ボード</title>
  <style>
    :root{--navy:#0f172a;--blue:#2563eb;--bg:#f1f5f9;--card:#fff;--text:#172033;--muted:#64748b;--line:#dbe3ee;--red:#dc2626;--amber:#d97706;--green:#16805f}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
    body{padding-bottom:calc(94px + env(safe-area-inset-bottom))}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    header{position:sticky;top:0;z-index:10;padding:calc(14px + env(safe-area-inset-top)) 16px 12px;background:var(--navy);color:#fff;box-shadow:0 2px 14px #0f172a33}
    .head{max-width:720px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
    h1{font-size:21px;margin:0}.date{font-size:13px;color:#cbd5e1;margin-top:3px}
    .count{min-width:52px;text-align:center;background:#ffffff18;padding:7px 10px;border-radius:12px}.count b{display:block;font-size:20px}.count span{font-size:11px;color:#cbd5e1}
    main{max-width:720px;margin:auto;padding:15px}
    .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
    .metric{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}.metric b{display:block;font-size:20px}.metric span{font-size:12px;color:var(--muted)}
    .toolbar{display:flex;gap:8px;overflow:auto;padding-bottom:10px;scrollbar-width:none}.toolbar::-webkit-scrollbar{display:none}
    .filter{border:1px solid var(--line);background:#fff;color:#475569;padding:9px 14px;border-radius:999px;white-space:nowrap}.filter.active{background:var(--navy);border-color:var(--navy);color:#fff}
    #empty{display:none;text-align:center;color:var(--muted);padding:60px 15px}.empty-icon{font-size:42px;margin-bottom:9px}
    .task{background:var(--card);border:1px solid var(--line);border-left:5px solid #94a3b8;border-radius:15px;padding:13px;margin-bottom:10px;box-shadow:0 3px 12px #0f172a0a}
    .task.overdue{background:#fff1f2;border-color:#fca5a5;border-left-color:var(--red);box-shadow:0 4px 16px #dc262622}
    .task.high{border-left-color:var(--red)}.task.medium{border-left-color:var(--amber)}.task.low{border-left-color:var(--green)}.task.done{opacity:.58}.task.done .title{text-decoration:line-through}
    .row{display:flex;align-items:flex-start;gap:11px}.check{width:27px;height:27px;min-width:27px;border-radius:50%;border:2px solid #94a3b8;background:#fff;padding:0;color:#fff;font-weight:bold}.selected .check,.done .check{background:var(--green);border-color:var(--green)}
    .body{min-width:0;flex:1}.title{font-weight:700;line-height:1.45;overflow-wrap:anywhere}.memo{font-size:14px;color:#475569;margin-top:5px;white-space:pre-wrap}
    .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.tag{font-size:12px;border-radius:7px;padding:4px 7px;background:#eef2f7;color:#475569}.tag.over{background:var(--red);color:#fff;font-size:14px;font-weight:800;padding:5px 9px}.tag.today{background:#dbeafe;color:#1d4ed8}.tag.priority-high{background:#fee2e2;color:#b91c1c}
    .more{border:0;background:transparent;color:#64748b;font-size:22px;padding:0 3px}
    .actions{display:none;gap:7px;flex-wrap:wrap;margin-top:11px;padding-top:10px;border-top:1px solid var(--line)}.task.open .actions{display:flex}.small{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 13px;color:#334155}.small.delete{color:var(--red)}.small.undo{color:var(--green);font-weight:700}
    .fab{position:fixed;right:max(18px,calc((100vw - 720px)/2 + 18px));bottom:calc(19px + env(safe-area-inset-bottom));z-index:15;border:0;background:var(--blue);color:#fff;border-radius:18px;padding:15px 19px;font-weight:800;font-size:17px;box-shadow:0 8px 24px #2563eb66}
    .selection-actions{position:fixed;left:max(18px,calc((100vw - 720px)/2 + 18px));right:max(18px,calc((100vw - 720px)/2 + 18px));bottom:calc(19px + env(safe-area-inset-bottom));z-index:16;display:flex;gap:10px}.selection-actions[hidden]{display:none}.selection-actions button{flex:1;border:0;color:#fff;border-radius:18px;padding:15px 10px;font-weight:800;font-size:16px}.complete-btn{background:var(--green);box-shadow:0 8px 24px #16805f55}.delete-selected{background:var(--red);box-shadow:0 8px 24px #dc262644}
    dialog{border:0;border-radius:20px;padding:0;width:min(calc(100% - 24px),520px);max-height:90vh;box-shadow:0 24px 70px #0f172a55}dialog::backdrop{background:#0f172a99}
    .modal{padding:20px;max-height:88vh;overflow:auto}.modal h2{font-size:20px;margin:0 0 18px}.field{margin-bottom:14px}.field label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}.req{color:var(--red)}
    input,select,textarea{display:block;width:100%;min-width:0;max-width:100%;border:1px solid #cbd5e1;border-radius:11px;padding:12px;background:#fff;color:var(--text);font-size:16px}input[type="date"],input[type="time"]{-webkit-appearance:none;appearance:none;height:49px}textarea{min-height:75px;resize:vertical}
    .grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.grid>.field{min-width:0}.repeat-detail{display:none}.repeat-detail.show{display:block}.hidden{display:none!important}.modal-actions{display:flex;gap:9px;margin-top:20px}.modal-actions button{flex:1;border-radius:11px;padding:13px;font-weight:700}.cancel{background:#fff;border:1px solid var(--line)}.save{background:var(--blue);color:#fff;border:1px solid var(--blue)}
    @media(max-width:380px){.summary{gap:5px}.metric{padding:9px 5px}.grid{grid-template-columns:1fr}.fab{padding:14px 17px}}
  </style>
</head>
<body>
  <header><div class="head"><div><h1>日常管理ボード</h1><div class="date" id="today"></div></div><div class="count"><b id="remain">0</b><span>未完了</span></div></div></header>
  <main>
    <section class="summary"><div class="metric"><b id="highCount">0</b><span>優先度 高</span></div><div class="metric"><b id="todayCount">0</b><span>今日まで</span></div><div class="metric"><b id="doneCount">0</b><span>完了</span></div></section>
    <nav class="toolbar" aria-label="表示切替"><button class="filter active" data-filter="active">未完了</button><button class="filter" data-filter="today">今日</button><button class="filter" data-filter="all">すべて</button><button class="filter" data-filter="done">完了履歴</button></nav>
    <section id="list"></section>
    <section id="empty"><div class="empty-icon">✓</div><div>表示する項目はありません</div></section>
  </main>
  <div class="selection-actions" id="selectionActions" hidden><button class="complete-btn" id="completeBtn">✓ 完了</button><button class="delete-selected" id="deleteSelectedBtn">一括削除</button></div>
  <button class="fab" id="addBtn">＋ 追加</button>
  <dialog id="taskDialog">
    <form class="modal" id="taskForm">
      <h2 id="dialogTitle">やることを追加</h2>
      <input type="hidden" id="taskId">
      <div class="field"><label for="taskTitle">やること <span class="req">*</span></label><input id="taskTitle" maxlength="80" required placeholder="例：朝一の生産進捗を確認"></div>
      <div class="grid">
        <div class="field"><label for="priority">優先度</label><select id="priority"><option value="high">高</option><option value="medium" selected>中</option><option value="low">低</option></select></div>
        <div class="field"><label for="category">備考</label><input id="category" maxlength="20" placeholder="例：工程名"></div>
      </div>
      <div class="grid">
        <div class="field"><label for="dueDate">期限日</label><input id="dueDate" type="date"></div>
        <div class="field"><label for="dueTime">時刻</label><input id="dueTime" type="time"></div>
      </div>
      <div class="field"><label for="repeat">繰り返し</label><select id="repeat"><option value="none">なし</option><option value="daily">毎日（土日を除く）</option><option value="weekly">毎週</option><option value="monthly">毎月</option></select></div>
      <div class="field repeat-detail" id="weeklyDetail"><label for="weeklyDay">曜日</label><select id="weeklyDay"><option value="1">月曜日</option><option value="2">火曜日</option><option value="3">水曜日</option><option value="4">木曜日</option><option value="5">金曜日</option><option value="6">土曜日</option><option value="0">日曜日</option></select></div>
      <div class="repeat-detail" id="monthlyDetail"><div class="field"><label for="monthlyType">毎月の指定</label><select id="monthlyType"><option value="weekday">第○曜日</option><option value="monthEnd">月末</option></select></div><div class="grid" id="monthlyWeekdayFields"><div class="field"><label for="monthlyWeek">第何週</label><select id="monthlyWeek"><option value="1">第1</option><option value="2">第2</option><option value="3">第3</option><option value="4">第4</option><option value="5">第5</option></select></div><div class="field"><label for="monthlyDay">曜日</label><select id="monthlyDay"><option value="1">月曜日</option><option value="2">火曜日</option><option value="3">水曜日</option><option value="4">木曜日</option><option value="5">金曜日</option><option value="6">土曜日</option><option value="0">日曜日</option></select></div></div></div>
      <div class="repeat-detail" id="repeatEndDetail"><div class="field"><label for="repeatEndType">繰り返す期間</label><select id="repeatEndType"><option value="fiscal" selected>今年度末まで</option><option value="1month">1か月間</option><option value="3months">3か月間</option><option value="1year">1年間</option><option value="custom">終了日を指定</option></select></div><div class="field hidden" id="repeatEndDateField"><label for="repeatEndDate">終了日</label><input id="repeatEndDate" type="date"></div></div>
      <div class="field"><label for="reminderMinutes">iPhoneカレンダー通知</label><select id="reminderMinutes"><option value="none" selected>通知しない</option><option value="0">設定時刻</option><option value="10">10分前</option><option value="30">30分前</option><option value="60">1時間前</option></select></div>
      <div class="field"><label for="memo">メモ</label><textarea id="memo" maxlength="300" placeholder="確認内容や報告基準など"></textarea></div>
      <div class="modal-actions"><button type="button" class="cancel" id="cancelBtn">キャンセル</button><button type="submit" class="save">保存</button></div>
    </form>
  </dialog>
  <script>
    const KEY='daily-management-tasks-v1';
    const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
    let tasks=load(), filter='active', selected=new Set();
    const jpDate=d=>new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'}).format(d);
    const ymd=d=>{const z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`};
    $('#today').textContent=jpDate(new Date());
    function load(){try{return (JSON.parse(localStorage.getItem(KEY))||[]).map(t=>t.repeat==='weekdays'?{...t,repeat:'daily'}:t)}catch{return []}}
    function save(){localStorage.setItem(KEY,JSON.stringify(tasks));render()}
    function esc(v=''){return v.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
    function priorityName(v){return {high:'高',medium:'中',low:'低'}[v]}
    function repeatName(v){return {daily:'毎日（土日除く）',weekly:'毎週',monthly:'毎月'}[v]||''}
    function dayName(v){return ['日','月','火','水','木','金','土'][Number(v)]+'曜日'}
    function repeatDescription(t){if(t.repeat==='weekly')return `毎週 ${dayName(t.repeatDay??1)}`;if(t.repeat==='monthly')return t.monthlyType==='monthEnd'?'毎月 月末':`毎月 第${t.repeatWeek??1}${dayName(t.repeatDay??1)}`;return repeatName(t.repeat)}
    function fiscalEnd(from=new Date()){const year=from.getMonth()<3?from.getFullYear():from.getFullYear()+1;return new Date(year,2,31,23,59,59)}
    function repeatUntil(t,start){if(t.repeat==='none')return null;const type=t.repeatEndType||'fiscal';if(type==='custom'&&t.repeatEndDate)return new Date(`${t.repeatEndDate}T23:59:59`);if(type==='1month'){const d=new Date(start);d.setMonth(d.getMonth()+1);return d}if(type==='3months'){const d=new Date(start);d.setMonth(d.getMonth()+3);return d}if(type==='1year'){const d=new Date(start);d.setFullYear(d.getFullYear()+1);return d}return fiscalEnd(start)}
    function repeatPeriodLabel(t){if(t.repeat==='none')return'';const start=nextCalendarDate(t)||new Date(),end=repeatUntil(t,start);return end?`～ ${end.toLocaleDateString('ja-JP',{year:'numeric',month:'numeric',day:'numeric'})}`:''}
    function reminderLabel(v){if(v===null||v===undefined||v==='none')return'通知なし';return Number(v)===0?'設定時刻':Number(v)===60?'1時間前':`${Number(v)}分前`}
    function completedLabel(value){if(!value)return'';const d=new Date(value);return `完了 ${d.toLocaleDateString('ja-JP',{month:'numeric',day:'numeric',weekday:'short'})} ${d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}`}
    function updateMonthlyFields(){$('#monthlyWeekdayFields').classList.toggle('hidden',$('#monthlyType').value==='monthEnd')}
    function updateRepeatEndFields(){$('#repeatEndDateField').classList.toggle('hidden',$('#repeatEndType').value!=='custom')}
    function updateRepeatFields(){const value=$('#repeat').value;$('#weeklyDetail').classList.toggle('show',value==='weekly');$('#monthlyDetail').classList.toggle('show',value==='monthly');$('#repeatEndDetail').classList.toggle('show',value!=='none');updateMonthlyFields();updateRepeatEndFields()}
    function isOverdue(t){if(t.done||!t.dueDate)return false;const limit=new Date(`${t.dueDate}T${t.dueTime||'23:59'}:00`);return limit.getTime()<Date.now()}
    function toggleSelect(id){const t=tasks.find(x=>x.id===id);if(!t||t.done)return;selected.has(id)?selected.delete(id):selected.add(id);render()}
    function completeSelected(){if(!selected.size)return;const now=new Date().toISOString();tasks.forEach(t=>{if(selected.has(t.id)){t.done=true;t.completedAt=now}});selected.clear();save()}
    function undoComplete(id){const t=tasks.find(x=>x.id===id);if(!t)return;t.done=false;t.completedAt=null;save()}
    function deleteSelected(){if(!selected.size)return;const count=selected.size;if(!confirm(`選択した${count}件を削除しますか？\n削除した項目は元に戻せません。`))return;tasks=tasks.filter(t=>!selected.has(t.id));selected.clear();save()}
    function openForm(task=null){$('#taskForm').reset();$('#taskId').value=task?.id||'';$('#dialogTitle').textContent=task?'やることを編集':'やることを追加';$('#taskTitle').value=task?.title||'';$('#priority').value=task?.priority||'medium';$('#category').value=task?.category||'';$('#dueDate').value=task?.dueDate||'';$('#dueTime').value=task?.dueTime||'';$('#repeat').value=task?.repeat||'none';$('#weeklyDay').value=task?.repeatDay??1;$('#monthlyType').value=task?.monthlyType||'weekday';$('#monthlyWeek').value=task?.repeatWeek??1;$('#monthlyDay').value=task?.repeatDay??1;$('#repeatEndType').value=task?.repeatEndType||'fiscal';$('#repeatEndDate').value=task?.repeatEndDate||'';$('#reminderMinutes').value=task?.reminderMinutes??'none';$('#memo').value=task?.memo||'';updateRepeatFields();$('#taskDialog').showModal();setTimeout(()=>$('#taskTitle').focus(),100)}
    function nthWeekday(year,month,weekday,n){const first=new Date(year,month,1,12);const day=1+(7+weekday-first.getDay())%7+(n-1)*7;const d=new Date(year,month,day,12);return d.getMonth()===month?d:null}
    function nextCalendarDate(t){
      const [hh,mm]=(t.dueTime||'').split(':').map(Number);if(!t.dueTime)return null;
      if(t.dueDate)return new Date(`${t.dueDate}T${t.dueTime}:00`);
      if(t.repeat==='none')return null;const now=new Date();
      if(t.repeat==='daily'){for(let i=0;i<8;i++){const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+i,hh,mm);if([0,6].includes(d.getDay()))continue;if(d>now)return d}}
      if(t.repeat==='weekly'){for(let i=0;i<8;i++){const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+i,hh,mm);if(d.getDay()===Number(t.repeatDay??1)&&d>now)return d}}
      if(t.repeat==='monthly'){for(let i=0;i<14;i++){const base=new Date(now.getFullYear(),now.getMonth()+i,1);const d=t.monthlyType==='monthEnd'?new Date(base.getFullYear(),base.getMonth()+1,0,12):nthWeekday(base.getFullYear(),base.getMonth(),Number(t.repeatDay??1),Number(t.repeatWeek??1));if(d){d.setHours(hh,mm,0,0);if(d>now)return d}}}
      return null;
    }
    function icsDate(d){const z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}T${z(d.getHours())}${z(d.getMinutes())}00`}
    function icsUtcDate(d){const z=n=>String(n).padStart(2,'0');return `${d.getUTCFullYear()}${z(d.getUTCMonth()+1)}${z(d.getUTCDate())}T${z(d.getUTCHours())}${z(d.getUTCMinutes())}${z(d.getUTCSeconds())}Z`}
    function icsText(v=''){return String(v).replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;')}
    function repeatRule(t,start){const days=['SU','MO','TU','WE','TH','FR','SA'];let rule='';if(t.repeat==='daily')rule='FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR';if(t.repeat==='weekly')rule=`FREQ=WEEKLY;BYDAY=${days[Number(t.repeatDay??1)]}`;if(t.repeat==='monthly')rule=t.monthlyType==='monthEnd'?'FREQ=MONTHLY;BYMONTHDAY=-1':`FREQ=MONTHLY;BYDAY=${Number(t.repeatWeek??1)}${days[Number(t.repeatDay??1)]}`;if(!rule)return'';return`RRULE:${rule};UNTIL=${icsUtcDate(repeatUntil(t,start))}`}
    function addToCalendar(id){const t=tasks.find(x=>x.id===id);if(!t)return;const start=nextCalendarDate(t);if(!start){alert('カレンダー登録には「時刻」が必要です。\n繰り返しなしの場合は「期限日」も入力してください。');return}const end=new Date(start.getTime()+30*60000),hasReminder=t.reminderMinutes!==null&&t.reminderMinutes!==undefined&&t.reminderMinutes!=='none',mins=hasReminder?Number(t.reminderMinutes):null,rrule=repeatRule(t,start),until=repeatUntil(t,start);const alarm=hasReminder?['BEGIN:VALARM',`TRIGGER:${mins===0?'PT0M':`-PT${mins}M`}`,'ACTION:DISPLAY',`DESCRIPTION:${icsText(t.title)}の時間です`,'END:VALARM']:[];const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Daily Management Board//JA','CALSCALE:GREGORIAN','METHOD:PUBLISH','BEGIN:VEVENT',`UID:${t.id}@daily-management-board`,`DTSTAMP:${icsDate(new Date())}`,`DTSTART;TZID=Asia/Tokyo:${icsDate(start)}`,`DTEND;TZID=Asia/Tokyo:${icsDate(end)}`,`SUMMARY:${icsText(t.title)}`,`DESCRIPTION:${icsText([t.category,t.memo].filter(Boolean).join(' / '))}`,rrule,...alarm,'END:VEVENT','END:VCALENDAR'].filter(Boolean);const blob=new Blob([lines.join('\r\n')],{type:'text/calendar;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`${t.title.replace(/[\\/:*?"<>|]/g,'_')}.ics`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);alert(`カレンダー登録ファイルを作成しました。\n期間：${t.repeat==='none'?'1回のみ':until.toLocaleDateString('ja-JP')+'まで'}\n通知：${reminderLabel(t.reminderMinutes)}\nダウンロードしたファイルを開き、カレンダーへ追加してください。`)}
    function render(){
      const today=ymd(new Date()), active=tasks.filter(t=>!t.done);
      $('#remain').textContent=active.length;$('#highCount').textContent=active.filter(t=>t.priority==='high').length;$('#todayCount').textContent=active.filter(t=>t.dueDate&&t.dueDate<=today).length;$('#doneCount').textContent=tasks.filter(t=>t.done).length;
      $('#selectionActions').hidden=selected.size===0;$('#addBtn').hidden=selected.size>0;$('#completeBtn').textContent=`✓ 完了（${selected.size}件）`;$('#deleteSelectedBtn').textContent=`一括削除（${selected.size}件）`;
      let shown=tasks.filter(t=>filter==='all'||filter==='active'&&!t.done||filter==='done'&&t.done||filter==='today'&&!t.done&&t.dueDate&&t.dueDate<=today);
      const rank={high:0,medium:1,low:2};shown.sort((a,b)=>filter==='done'?rank[a.priority]-rank[b.priority]||(b.completedAt||'').localeCompare(a.completedAt||''):Number(a.done)-Number(b.done)||rank[a.priority]-rank[b.priority]||(a.dueDate||'9999').localeCompare(b.dueDate||'9999')||(a.dueTime||'23:59').localeCompare(b.dueTime||'23:59')||a.createdAt.localeCompare(b.createdAt));
      $('#empty').style.display=shown.length?'none':'block';
      $('#list').innerHTML=shown.map(t=>{const over=isOverdue(t), dueToday=!t.done&&t.dueDate===today;const date=t.dueDate?new Date(t.dueDate+'T12:00').toLocaleDateString('ja-JP',{month:'numeric',day:'numeric',weekday:'short'}):'';const isSelected=selected.has(t.id);return `<article class="task ${t.priority} ${t.done?'done':''} ${isSelected?'selected':''} ${over?'overdue':''}" data-id="${t.id}"><div class="row"><button class="check" aria-label="${t.done?'完了済み':isSelected?'選択を外す':'完了する項目に選択'}">${t.done||isSelected?'✓':''}</button><div class="body"><div class="title">${esc(t.title)}</div>${t.memo?`<div class="memo">${esc(t.memo)}</div>`:''}<div class="tags">${over?`<span class="tag over">⚠ 期限超過</span>`:''}<span class="tag priority-${t.priority}">優先度 ${priorityName(t.priority)}</span>${t.category?`<span class="tag">${esc(t.category)}</span>`:''}${date?`<span class="tag ${!over&&dueToday?'today':''}">${date}</span>`:''}${t.dueTime?`<span class="tag ${!over&&dueToday?'today':''}">🕒 ${t.dueTime}</span>`:''}${t.repeat!=='none'?`<span class="tag">↻ ${repeatDescription(t)}</span><span class="tag">${repeatPeriodLabel(t)}</span>`:''}${t.dueTime?`<span class="tag">${reminderLabel(t.reminderMinutes)}</span>`:''}${t.done&&t.completedAt?`<span class="tag">✓ ${completedLabel(t.completedAt)}</span>`:''}</div></div><button class="more" aria-label="操作を表示">⋯</button></div><div class="actions">${t.done?`<button class="small undo" type="button">完了を取り消す</button>`:`<button class="small edit" type="button">編集</button><button class="small calendar" type="button">カレンダー登録</button>`}<button class="small delete" type="button">削除</button></div></article>`}).join('');
    }
    $('#addBtn').onclick=()=>openForm();$('#completeBtn').onclick=completeSelected;$('#deleteSelectedBtn').onclick=deleteSelected;$('#cancelBtn').onclick=()=>$('#taskDialog').close();
    $('#taskDialog').addEventListener('click',e=>{if(e.target===$('#taskDialog'))$('#taskDialog').close()});
    $('#repeat').onchange=updateRepeatFields;$('#monthlyType').onchange=updateMonthlyFields;$('#repeatEndType').onchange=updateRepeatEndFields;
    $('#taskForm').onsubmit=e=>{e.preventDefault();const id=$('#taskId').value,repeat=$('#repeat').value,monthlyType=$('#monthlyType').value,reminderValue=$('#reminderMinutes').value,repeatEndType=$('#repeatEndType').value;if(repeat!=='none'&&repeatEndType==='custom'&&!$('#repeatEndDate').value){alert('繰り返しの終了日を入力してください。');return}const data={title:$('#taskTitle').value.trim(),priority:$('#priority').value,category:$('#category').value.trim(),dueDate:$('#dueDate').value,dueTime:$('#dueTime').value,repeat,monthlyType:repeat==='monthly'?monthlyType:null,repeatDay:repeat==='weekly'?Number($('#weeklyDay').value):repeat==='monthly'&&monthlyType==='weekday'?Number($('#monthlyDay').value):null,repeatWeek:repeat==='monthly'&&monthlyType==='weekday'?Number($('#monthlyWeek').value):null,repeatEndType:repeat!=='none'?repeatEndType:null,repeatEndDate:repeat!=='none'&&repeatEndType==='custom'?$('#repeatEndDate').value:null,reminderMinutes:reminderValue==='none'?null:Number(reminderValue),memo:$('#memo').value.trim()};if(!data.title)return;if(id){Object.assign(tasks.find(t=>t.id===id),data)}else{tasks.push({...data,id:crypto.randomUUID(),done:false,completedAt:null,createdAt:new Date().toISOString()})}$('#taskDialog').close();save()};
    $('#list').onclick=e=>{const card=e.target.closest('.task');if(!card)return;const id=card.dataset.id;if(e.target.closest('.check'))toggleSelect(id);else if(e.target.closest('.more'))card.classList.toggle('open');else if(e.target.closest('.undo'))undoComplete(id);else if(e.target.closest('.calendar'))addToCalendar(id);else if(e.target.closest('.edit'))openForm(tasks.find(t=>t.id===id));else if(e.target.closest('.delete')&&confirm('この項目を削除しますか？')){selected.delete(id);tasks=tasks.filter(t=>t.id!==id);save()}};
    $$('.filter').forEach(b=>b.onclick=()=>{$$('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});
    render();
  </script>
</body>
